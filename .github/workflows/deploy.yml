name: Deploy to Shopify Dev Store

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Deploy Theme
        run: npx shopify theme push --store ${{ secrets.SHOPIFY_STORE }} --allow-live --password ${{ secrets.SHOPIFY_TOKEN }}
        env:
          CI: true

